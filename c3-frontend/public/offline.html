<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Offline • C3 Portal</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #000000;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top, 24px) env(safe-area-inset-right, 24px) env(safe-area-inset-bottom, 24px) env(safe-area-inset-left, 24px);
        text-align: center;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.05) 0%, rgba(10, 10, 10, 0.8) 100%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 36px 28px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(12px);
      }
      .logo-badge {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 20px;
        background: #000000;
        border: 1px solid rgba(255, 255, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      }
      .logo-badge img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 9999px;
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #f87171;
        font-size: 11px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 600;
        margin-bottom: 14px;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #ef4444;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
        color: #ffffff;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: #94a3b8;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 48px;
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 600;
        color: #000000;
        background-color: #ffffff;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        transition: transform 0.15s ease, background-color 0.15s ease, opacity 0.15s ease;
        text-decoration: none;
      }
      .btn:hover {
        background-color: #e2e8f0;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .brand {
        margin-top: 24px;
        font-size: 11px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        color: #52525b;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo-badge">
        <img src="/icons/icon-192.png" alt="C3 Logo" width="72" height="72" />
      </div>
      <div class="pill">
        <span class="dot"></span>
        <span>Offline Mode</span>
      </div>
      <h1>You are offline</h1>
      <p>Please turn on your internet connection to use the Campus to Corporate Club portal.</p>
      <button class="btn" onclick="window.location.reload()">Retry Connection</button>
      <div class="brand">Campus to Corporate Club (C3)</div>
    </div>
  </body>
</html>
